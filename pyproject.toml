[project]
name = "flutter-bridge-mcp"
version = "0.1.0"
description = "MCP server that joins Android's view of a running Flutter app to Dart's — screen coordinates, widget tree and source locations in one place"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "pillow>=10,<12",
    "websockets>=12,<16",
]

[project.scripts]
flutter-bridge-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
sources = ["."]
